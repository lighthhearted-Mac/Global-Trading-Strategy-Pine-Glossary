        <p style="color:var(--color-secondary);font-size:1.0625rem">
          Test a Composer RSI rule before you build it. Pick a ticker, a level and a fund to hold, and see what the fund did after each level, one rule or a whole cascade.

  <script src="data/prices.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      renderBreadcrumb('breadcrumb-root', [
        { label: 'Home', href: u('/') },
        { label: 'RSI Signals', href: u('/rsi.html') },
        { label: 'RSI Backtester' },
      ]);

      // ---------- data ----------
      let P, DATES, N;
      const rsiCache = new Map();

      async function loadPrices() {
        if (window.PRICES_DATA) return window.PRICES_DATA;
        const res = await fetch(`${BASE}/data/prices.json`);
        if (!res.ok) throw new Error('Failed to load prices.json');
        return res.json();
      }

      // Wilder RSI, seeded per ticker from its first price: the first p changes
      // are averaged, then each day is (prev * (p - 1) + today) / p. A missing
      // bar after listing outputs NaN and carries the state forward. This is
      // the formula the 2026-10 research matched to Composer's backtester.
      function rsiOf(sym, p) {
        const key = sym + ':' + p;
        if (rsiCache.has(key)) return rsiCache.get(key);
        const c = P.tickers[sym].closes;
        const out = new Float64Array(N).fill(NaN);
        let prev = null, k = 0, ag = 0, al = 0;
        for (let i = 0; i < N; i++) {
          const x = c[i];
          if (x == null) continue;
          if (prev != null) {
            const d = x - prev, g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
            k++;
            if (k <= p) { ag += g / p; al += l / p; }
            else { ag = (ag * (p - 1) + g) / p; al = (al * (p - 1) + l) / p; }
            if (k >= p) out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
          }
          prev = x;
        }
        rsiCache.set(key, out);
        return out;
      }

      // ---------- state ----------
      const DEF = { sig: 'QQQ', buy: 'TQQQ', dir: 'lt', lvl: 30, win: 10, els: 'BIL', range: 'ytd' };
      const S = Object.assign({}, DEF);

      function readUrl() {
        const q = new URLSearchParams(location.search);
        const t = s => (s && P.tickers[s.toUpperCase()] ? s.toUpperCase() : null);
        S.sig = t(q.get('sig')) || DEF.sig;
        S.buy = t(q.get('buy')) || DEF.buy;
        S.dir = q.get('dir') === 'gt' ? 'gt' : 'lt';
        const l = parseFloat(q.get('lvl')); S.lvl = isFinite(l) && l > 0 && l < 100 ? l : (S.dir === 'gt' ? 79 : DEF.lvl);
        const w = parseInt(q.get('win'), 10); S.win = w >= 2 && w <= 252 ? w : DEF.win;
        const e = q.get('else'); S.els = e === 'cash' ? 'cash' : (t(e) || DEF.els);
        S.range = ['ytd', '1y', '3y', '5y', 'all'].includes(q.get('range')) ? q.get('range') : DEF.range;
      }
      function writeUrl() {
        const q = new URLSearchParams();
        for (const k of ['sig', 'buy', 'dir', 'lvl', 'win']) if (S[k] !== DEF[k]) q.set(k, S[k]);
        if (S.els !== DEF.els) q.set('else', S.els);
        if (S.range !== DEF.range) q.set('range', S.range);
        const qs = q.toString();
        if (window.history && history.replaceState) history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
      }

      // Dropdown choices for the RSI level; the window is typed (2 to 252, as in Composer)
      const clampWin = v => Math.min(252, Math.max(2, Math.round(v)));
      const lvlOptions = sel => Array.from({ length: 99 }, (_, k) => k + 1)
        .map(l => `<option value="${l}"${l === +sel ? ' selected' : ''}>${l}</option>`).join('');

      // ---------- formatting ----------
      const MINUS = '−';
      function pct(v, dp) {
        if (v == null || !isFinite(v)) return '—';
        const a = Math.abs(v * 100);
        const d = dp != null ? dp : (a >= 100 ? 0 : 1);
        return (v < 0 ? MINUS : '+') + a.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
      }
      const signed = (v, dp) => `<span class="${v < 0 ? 'rb-neg' : ''}">${pct(v, dp)}</span>`;
      const fmtDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      // ---------- engine ----------
      // Sample: every day i with a settled signal RSI and today's and
      // tomorrow's price for the fund. Signal read at close i, fund held to
      // close i + 1.
      function buildSample() {
        const r = rsiOf(S.sig, S.win);
        const b = P.tickers[S.buy].closes;
        const idx = [];
        for (let i = 0; i < N - 1; i++) if (isFinite(r[i]) && b[i] != null && b[i + 1] != null) idx.push(i);
        return { idx, r, b, rv: idx.map(i => r[i]), buyRet: idx.map(i => b[i + 1] / b[i] - 1) };
      }
      const fires = (v, lvl) => (S.dir === 'lt' ? v < lvl : v > lvl);

      function heldStats(sm, lvl, lo, hi) {
        lo = lo || 0; hi = hi == null ? sm.idx.length : hi;
        let n = 0, sum = 0, up = 0, worst = Infinity, lg = 0;
        const rets = [];
        for (let j = lo; j < hi; j++) {
          if (!fires(sm.rv[j], lvl)) continue;
          const x = sm.buyRet[j];
          n++; sum += x; if (x > 0) up++; if (x < worst) worst = x; lg += Math.log1p(x); rets.push(x);
        }
        return { n, avg: n ? sum / n : NaN, up: n ? up / n : NaN, worst: n ? worst : NaN, lg, comp: n ? Math.exp(lg) - 1 : NaN, rets };
      }

      // A crossing is the first day of each run where the rule is true.
      function crossings(sm, lvl) {
        const out = { n: 0, f: { 1: [], 5: [], 10: [], 20: [] } };
        for (let j = 1; j < sm.idx.length; j++) {
          if (!fires(sm.rv[j], lvl) || fires(sm.rv[j - 1], lvl)) continue;
          if (sm.idx[j] - sm.idx[j - 1] !== 1) continue;
          out.n++;
          const i = sm.idx[j];
          for (const h of [1, 5, 10, 20]) if (i + h < N && sm.b[i + h] != null) out.f[h].push(sm.b[i + h] / sm.b[i] - 1);
        }
        return out;
      }

      function levelList() {
        const L = [];
        if (S.dir === 'lt') for (let v = 40; v >= 20; v--) L.push(v);
        else for (let v = 60; v <= 90; v++) L.push(v);
        if (!L.includes(S.lvl)) { L.push(S.lvl); L.sort((a, b) => (S.dir === 'lt' ? b - a : a - b)); }
        return L;
      }

      // ---------- chart ----------
      function svgEl(tag, attrs) {
        const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }
      function rangeStart() {
        if (S.range === 'all') return 0;
        const last = new Date(DATES[N - 1] + 'T12:00:00');
        let from;
        if (S.range === 'ytd') from = new Date(last.getFullYear(), 0, 1);
        else { from = new Date(last); from.setFullYear(last.getFullYear() - { '1y': 1, '3y': 3, '5y': 5 }[S.range]); }
        const iso = from.toISOString().slice(0, 10);
        let i = 0; while (i < N && DATES[i] < iso) i++;
        return i;
      }
      function axisLabels(svg, i0, i1, x, H) {
        const span = (new Date(DATES[i1]) - new Date(DATES[i0])) / 864e5;
        const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        let prev = null, lastX = -99;
        for (let i = i0; i <= i1; i++) {
          const d = DATES[i], key = span > 800 ? d.slice(0, 4) : d.slice(0, 7);
          if (key === prev) continue;
          prev = key;
          const xx = x(i);
          if (xx - lastX < 38) continue;
          lastX = xx;
          const t = svgEl('text', { x: xx, y: H - 6 });
          t.textContent = span > 800 ? d.slice(0, 4) : M[+d.slice(5, 7) - 1] + (span > 400 ? ' ' + d.slice(2, 4) : '');
          svg.appendChild(t);
        }
      }
      function drawRsi(sm) {
        const wrap = document.getElementById('rb-rsi-chart');
        const W = 900, H = 300, L = 34, R = 10, T = 8, B = 24;
        const first = sm.idx.length ? sm.idx[0] : 0;
        const i0 = Math.max(rangeStart(), first), i1 = N - 1;
        const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${S.win}-day RSI of ${S.sig} with the ${S.lvl} level` });
        const x = i => L + (i - i0) * (W - L - R) / Math.max(1, i1 - i0);
        const y = v => T + (100 - v) * (H - T - B) / 100;
        const r = sm.r;
        let runStart = null;
        for (let i = i0; i <= i1 + 1; i++) {
          const on = i <= i1 && isFinite(r[i]) && fires(r[i], S.lvl);
          if (on && runStart == null) runStart = i;
          if (!on && runStart != null) {
            const x0 = x(runStart) - 1, x1 = x(i - 1) + 1;
            svg.appendChild(svgEl('rect', { x: x0, y: T, width: Math.max(1.5, x1 - x0), height: H - T - B, fill: 'var(--color-green)', opacity: 0.13 }));
            runStart = null;
          }
        }
        for (const v of [0, 30, 50, 70, 100]) {
          svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--color-border)', 'stroke-width': 1 }));
          const t = svgEl('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = v; svg.appendChild(t);
        }
        svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: y(S.lvl), y2: y(S.lvl), stroke: 'var(--color-yellow)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
        const lt = svgEl('text', { x: W - R, y: y(S.lvl) - 5, 'text-anchor': 'end', style: 'fill:var(--color-yellow)' }); lt.textContent = 'level ' + S.lvl; svg.appendChild(lt);
        let d = '', pen = false;
        for (let i = i0; i <= i1; i++) {
          if (!isFinite(r[i])) { pen = false; continue; }
          d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[i]).toFixed(1); pen = true;
        }
        svg.appendChild(svgEl('path', { d, fill: 'none', stroke: 'var(--color-blue)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
        axisLabels(svg, i0, i1, x, H);
        wrap.innerHTML = '<div class="rb-tip"></div>';
        wrap.appendChild(svg);
        const tip = wrap.querySelector('.rb-tip');
        const vl = svgEl('line', { y1: T, y2: H - B, stroke: 'var(--color-border-strong)', 'stroke-width': 1, style: 'display:none' });
        svg.appendChild(vl);
        svg.addEventListener('pointermove', ev => {
          const rc = svg.getBoundingClientRect();
          const px = (ev.clientX - rc.left) * W / rc.width;
          const i = Math.max(i0, Math.min(i1, Math.round(i0 + (px - L) * (i1 - i0) / (W - L - R))));
          if (!isFinite(r[i])) return;
          vl.setAttribute('x1', x(i)); vl.setAttribute('x2', x(i)); vl.style.display = '';
          tip.innerHTML = `${fmtDate(DATES[i])} &nbsp;RSI ${r[i].toFixed(1)}${fires(r[i], S.lvl) ? ' &nbsp;<span style="color:var(--color-green)">signal</span>' : ''}`;
          tip.style.display = 'block';
          const wr = wrap.getBoundingClientRect();
          let left = ev.clientX - wr.left + 12;
          if (left + tip.offsetWidth > wr.width) left = ev.clientX - wr.left - tip.offsetWidth - 12;
          tip.style.left = Math.max(0, left) + 'px';
          tip.style.top = Math.max(0, ev.clientY - wr.top - 40) + 'px';
        });
        svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; vl.style.display = 'none'; });
      }

      // ---------- shared bits ----------
      function tickerOptions(sel) {
        const groups = {};
        for (const [sym, t] of Object.entries(P.tickers)) (groups[t.group || 'Other'] = groups[t.group || 'Other'] || []).push(sym);
        return Object.keys(groups).map(g =>
          `<optgroup label="${escapeHtml(g)}">` + groups[g].sort().map(s => `<option value="${s}"${s === sel ? ' selected' : ''}>${s}</option>`).join('') + '</optgroup>'
        ).join('');
      }
      const copyJson = sym => {
        const done = ok => { const c = document.getElementById('rb-copied'); c.textContent = ok ? 'JSON copied: paste it into Composer' : 'Copy failed'; setTimeout(() => (c.textContent = ''), 2400); };
        if (navigator.clipboard) navigator.clipboard.writeText(JSON.stringify(sym, null, 2)).then(() => done(true), () => done(false)); else done(false);
      };
      const copyLink = () => {
        const done = ok => { const c = document.getElementById('rb-copied'); c.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => (c.textContent = ''), 1800); };
        if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(() => done(true), () => done(false)); else done(false);
      };
      const median = a => { const v = a.filter(isFinite).sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : NaN; };
      const RSI_HELP = `<details class="rb-help"><summary>What is RSI, and how is this tested?</summary>
        <p><strong>RSI</strong> (relative strength index) scores how hard a price has moved over the last few days, from 0 to 100. Under about 30 means it has fallen fast (oversold); over about 70 to 80 means it has risen fast (overbought).</p>
        <p><strong>The test:</strong> at every close in the price history, the page checks the rule. If it is true, it buys the fund and sells at the next close. Figures count only the days the fund is held.</p></details>`;
      const ASSUME = 'Assumptions: buy at the signal day\'s close (roughly how Composer trades) and sell at a later close; no costs or slippage; dividend-adjusted daily prices, refreshed weekly. This method matched a Composer backtest within about 2 points a year. Levels chosen on the same history they are tested on will most likely do worse live.';

      // ---------- one rule ----------
      const PRESETS = [
        { label: 'QQQ dips, buy TQQQ', sig: 'QQQ', dir: 'lt', lvl: 30, buy: 'TQQQ' },
        { label: 'SMH dips, buy SOXL', sig: 'SMH', dir: 'lt', lvl: 32, buy: 'SOXL' },
        { label: 'SPY dips, buy SPXL', sig: 'SPY', dir: 'lt', lvl: 29, buy: 'SPXL' },
        { label: 'QQQ overheats, buy UVXY', sig: 'QQQ', dir: 'gt', lvl: 80, buy: 'UVXY' },
      ];

      function shell() {
        document.getElementById('rb-root').innerHTML = `
          <div class="rb-panel">
            <div class="rb-chips"><span>Start from an example:</span>${PRESETS.map((p, k) => `<button type="button" class="rb-chip" data-p="${k}">${p.label}</button>`).join('')}</div>
            <p class="rb-sentence">
              When <select id="rb-sig" aria-label="Signal ticker">${tickerOptions(S.sig)}</select>'s
              <input id="rb-win" type="number" min="2" max="252" step="1" value="${S.win}" aria-label="RSI window in days, 2 to 252" title="2 to 252 days">-day RSI
              <select id="rb-dir" aria-label="Condition"><option value="lt"${S.dir === 'lt' ? ' selected' : ''}>is below</option><option value="gt"${S.dir === 'gt' ? ' selected' : ''}>is above</option></select>
              <select id="rb-lvl" aria-label="RSI level">${lvlOptions(S.lvl)}</select>,
              hold <select id="rb-buy" aria-label="Fund to buy">${tickerOptions(S.buy)}</select> the next day.
            </p>
            <p class="rb-names" id="rb-names"></p>
            ${RSI_HELP}
            <div class="rb-logic"><code id="rb-code"></code><button class="btn btn-outline btn-sm" id="rb-copy-link" type="button">Copy link</button><button class="btn btn-outline btn-sm" id="rb-json-copy" type="button" title="Paste into the Composer editor">Copy JSON</button><span class="rb-copied" id="rb-copied"></span></div>
          </div>

          <div class="rb-panel">
            <div class="rb-charthead">
              <h2 id="rb-rsi-title">RSI</h2>
              <div class="rb-seg" id="rb-range">${['ytd', '1y', '3y', '5y', 'all'].map(k => `<button type="button" data-r="${k}"${S.range === k ? ' class="is-on"' : ''}>${k === 'ytd' ? 'YTD' : k.toUpperCase()}</button>`).join('')}</div>
            </div>
            <div class="rb-stats" id="rb-stats"></div>
            <div class="rb-chart" id="rb-rsi-chart"></div>
            <div class="rb-legend"><span><i style="background:var(--color-blue)"></i>RSI</span><span><i style="background:var(--color-yellow)"></i>Your level</span><span><i style="background:var(--color-green);opacity:.4;height:10px"></i>Rule true</span></div>
          </div>

          <div class="rb-panel">
            <h2 id="rb-bt-title">Backtest</h2>
            <p class="rb-sub" id="rb-bt-sub"></p>
            <h3 class="rb-h3" id="rb-t2-title"></h3>
            <div class="db-table-wrap"><table class="db-table rb-table" id="rb-sweep"></table></div>
            <p class="rb-sub" style="margin-top:8px">Sharpe scores the whole rule: the fund on signal days, BIL on the rest, with no risk-free rate subtracted. <em>Every day</em> is holding the fund all the time. Click a row to use that level, or a header to sort.</p>
            <ul class="rb-notes" id="rb-notes"></ul>
          </div>`;

        const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
        on('rb-sig', 'change', e => { S.sig = e.target.value; update(); });
        on('rb-buy', 'change', e => { S.buy = e.target.value; update(); });
        on('rb-dir', 'change', e => {
          S.dir = e.target.value;
          if (S.dir === 'gt' && S.lvl < 50) S.lvl = 79;
          if (S.dir === 'lt' && S.lvl > 50) S.lvl = 30;
          update();
        });
        on('rb-lvl', 'change', e => { const v = parseFloat(e.target.value); if (v > 0 && v < 100) { S.lvl = v; update(); } });
        on('rb-win', 'change', e => { const v = parseFloat(e.target.value); if (!isFinite(v)) { e.target.value = S.win; return; } S.win = clampWin(v); e.target.value = S.win; update(); });
        document.querySelector('.rb-chips').addEventListener('click', e => {
          const b = e.target.closest('[data-p]'); if (!b) return;
          const p = PRESETS[+b.dataset.p];
          Object.assign(S, { sig: p.sig, dir: p.dir, lvl: p.lvl, buy: p.buy, win: 10 });
          shell(); update();
        });
        document.getElementById('rb-range').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          S.range = b.dataset.r;
          document.querySelectorAll('#rb-range button').forEach(x => x.classList.toggle('is-on', x === b));
          writeUrl(); drawRsi(buildSample()); rsiStats(buildSample());
        });
        on('rb-copy-link', 'click', copyLink);
        on('rb-json-copy', 'click', () => copyJson({
          id: cShortId(), step: 'root', name: `IF ${S.sig} ${S.win}d RSI ${S.dir === 'lt' ? '<' : '>'} ${S.lvl} THEN ${S.buy}`,
          children: [{ id: cUid(), step: 'wt-cash-equal', name: 'Weight', suppress_incomplete_warnings: true,
            children: [cIf([{ buy: S.buy, sig: [{ t: S.sig, dir: S.dir, lvl: S.lvl, win: S.win }] }], 0)] }],
          description: 'Built with the Composer Atlas RSI Backtester: holds ' + S.buy + ' the day after the rule is true, BIL otherwise. ' + location.href,
          rebalance: 'daily',
        }));
        const pickRow = e => { const tr = e.target.closest('tr[data-l]'); if (!tr) return; S.lvl = parseFloat(tr.dataset.l); update(); };
        on('rb-sweep', 'click', pickRow);
      }

      // RSI stats for the chart's visible range, as in the original analysis
      function rsiStats(sm) {
        const i0 = Math.max(rangeStart(), sm.idx.length ? sm.idx[0] : 0);
        let hi = -1, lo = 101, hiI = i0, loI = i0, nOn = 0, last = N - 1;
        for (let i = i0; i < N; i++) {
          const v = sm.r[i]; if (!isFinite(v)) continue;
          if (v > hi) { hi = v; hiI = i; } if (v < lo) { lo = v; loI = i; }
          if (fires(v, S.lvl)) nOn++;
          last = i;
        }
        const st = (a, b) => `<div><b>${a}</b><span>${b}</span></div>`;
        document.getElementById('rb-stats').innerHTML = [
          st(sm.r[last].toFixed(1), 'latest, ' + fmtDate(DATES[last])),
          st(hi.toFixed(1), 'high, ' + fmtDate(DATES[hiI])),
          st(lo.toFixed(1), 'low, ' + fmtDate(DATES[loI])),
          st(nOn, `days ${S.dir === 'lt' ? 'below' : 'above'} ${S.lvl} in this range`),
        ].join('');
      }

      function update() {
        writeUrl();
        const sym = s => escapeHtml(s);
        const cmp = S.dir === 'lt' ? '<' : '>', word = S.dir === 'lt' ? 'below' : 'above';
        document.getElementById('rb-code').textContent = `IF ${S.win}d RSI of ${S.sig} ${cmp} ${S.lvl}  ->  ${S.buy}`;
        document.getElementById('rb-lvl').value = S.lvl;
        document.getElementById('rb-dir').value = S.dir;
        document.getElementById('rb-names').innerHTML = [...new Set([S.sig, S.buy])].map(s => `<b>${sym(s)}</b> ${sym(P.tickers[s].name)}`).join(' &middot; ');
        document.getElementById('rb-rsi-title').textContent = `${S.sig} ${S.win}-day RSI`;

        const sm = buildSample();
        if (sm.idx.length < 60) {
          document.getElementById('rb-bt-sub').textContent = 'These tickers do not share enough price history to test.';
          return;
        }
        drawRsi(sm); rsiStats(sm);
        const from = DATES[sm.idx[0]], to = DATES[sm.idx[sm.idx.length - 1] + 1], yrs = sm.idx.length / 252;
        document.getElementById('rb-bt-title').textContent = `Backtest: hold ${S.buy} when ${S.sig}'s ${S.win}-day RSI is ${S.dir === 'lt' ? 'oversold' : 'overbought'}`;
        document.getElementById('rb-bt-sub').textContent = `${fmtDate(from)} to ${fmtDate(to)}, ${yrs.toFixed(1)} years.`;
        document.getElementById('rb-t2-title').textContent = `The Composer rule: hold ${S.buy} the day after any close where ${S.sig}'s RSI is ${word} the level`;

        const levels = levelList();
        const avg = a => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN);
        const sel = l => (l === S.lvl ? ' class="is-sel"' : '');
        const base = {};
        for (const h of [1, 5, 10, 20]) {
          const a = [];
          for (const i of sm.idx) if (i + h < N && sm.b[i + h] != null) a.push(sm.b[i + h] / sm.b[i] - 1);
          base[h] = avg(a);
        }
        // whole-rule Sharpe: the fund on signal days, BIL otherwise (cash where
        // BIL has no price), no risk-free rate subtracted; matches the advanced view
        const bil = P.tickers.BIL ? P.tickers.BIL.closes : null;
        const elseRet = sm.idx.map(i => (bil && bil[i] != null && bil[i + 1] != null ? bil[i + 1] / bil[i] - 1 : 0));
        const sharpeOf = pick => {
          let s = 0, s2 = 0; const n = sm.idx.length;
          for (let j = 0; j < n; j++) { const x = pick(j) ? sm.buyRet[j] : elseRet[j]; s += x; s2 += x * x; }
          const m = s / n, sd = Math.sqrt(Math.max(0, s2 / n - m * m));
          return sd ? m / sd * Math.sqrt(252) : NaN;
        };
        const shTxt = v => `<span class="${v < 0 ? 'rb-neg' : ''}">${isFinite(v) ? v.toFixed(2) : '—'}</span>`;
        const hsBy = new Map(levels.map(l => [l, heldStats(sm, l)]));
        document.getElementById('rb-sweep').innerHTML =
          `<thead><tr><th>Level</th><th>Days held</th><th>Avg per day held</th><th>Up days</th><th>Worst day held</th><th>Compounded over held days</th><th>Sharpe</th></tr></thead><tbody>` +
          levels.map(l => {
            const a = hsBy.get(l);
            return a.n
              ? `<tr data-l="${l}"${sel(l)}><td>${cmp} ${l}</td><td>${a.n}</td><td>${signed(a.avg, 2)}</td><td>${Math.round(a.up * 100)}%</td><td>${signed(a.worst)}</td><td>${signed(a.comp)}</td><td>${shTxt(sharpeOf(j => fires(sm.rv[j], l)))}</td></tr>`
              : `<tr data-l="${l}"${sel(l)}><td>${cmp} ${l}</td><td>0</td><td colspan="5" style="text-align:left">never held</td></tr>`;
          }).join('') + (bh => `<tr class="is-base"><td>every day</td><td>${bh.n}</td><td>${pct(bh.avg, 2)}</td><td>${Math.round(bh.up * 100)}%</td><td>${pct(bh.worst)}</td><td>${pct(bh.comp)}</td><td>${isFinite(bh.sh) ? bh.sh.toFixed(2) : '—'}</td></tr>`)(
            Object.assign(heldStats(sm, S.dir === 'lt' ? 101 : -1), { sh: sharpeOf(() => true) })) + '</tbody>';

        // notes, written from the numbers
        const hs = hsBy.get(S.lvl), cr = crossings(sm, S.lvl), notes = [];
        if (hs.n) {
          const H2 = Math.floor(sm.idx.length / 2), h1 = heldStats(sm, S.lvl, 0, H2), h2 = heldStats(sm, S.lvl, H2);
          const near = []; for (let d = -2; d <= 2; d++) if (d && hsBy.has(S.lvl + d) && hsBy.get(S.lvl + d).n) near.push(hsBy.get(S.lvl + d).lg);
          const nb = near.length ? Math.exp(median(near)) - 1 : NaN;
          notes.push(`<b>At ${cmp} ${S.lvl}:</b> ${S.buy} was held on ${hs.n} days (about ${Math.round(hs.n / yrs)} a year), averaged ${pct(hs.avg, 2)} a day against ${pct(base[1], 2)} on any day, and compounded ${pct(hs.comp)} over those days.`);
          if (hs.avg <= base[1]) notes.push(`<b>No edge at this level.</b> The average day held is no better than any day.`);
          if (cr.n < 20) notes.push(`<b>Small sample.</b> RSI crossed ${word} ${S.lvl} only ${cr.n} time${cr.n === 1 ? '' : 's'} in ${yrs.toFixed(0)} years, so treat the win rates as a handful of trades, not a pattern.`);
          if (isFinite(nb)) notes.push(hs.lg - Math.log1p(nb) > Math.log(1.5)
            ? `<b>A spike, not a plateau.</b> The levels within 2 points have a median of ${pct(nb)}, well below this level's ${pct(hs.comp)}. Do not over-tune the exact number.`
            : `<b>Neighbours agree.</b> The levels within 2 points have a median of ${pct(nb)}, close to this level's ${pct(hs.comp)}.`);
          if (h1.n && h2.n) notes.push(`<b>Halves:</b> ${pct(h1.comp)} before ${fmtDate(DATES[sm.idx[H2]])} and ${pct(h2.comp)} after${(h1.comp < 0) !== (h2.comp < 0) ? ', so it worked in one era and not the other' : ''}.`);
        } else notes.push(`<b>Never held at ${cmp} ${S.lvl}.</b> RSI never got that far in this history.`);
        notes.push(ASSUME);
        document.getElementById('rb-notes').innerHTML = notes.map(n => `<li>${n}</li>`).join('');
        resortAll();
      }

      // ---------- cascade ----------
      // An ordered IF / ELSE IF list. Each rule is true when ANY of its
      // tickers' RSI crosses its level; the first true rule picks the fund.
      const OB12 = 'SMH QQQ SPY TQQQ TECL QQQE VOOG VOOV VTV FAS XLP XLY'.split(' ');
      const CDEF = {
        br: [
          { t: ['SMH'], dir: 'lt', lvl: 32, win: 10, buy: 'SOXL' },
          { t: ['QQQ'], dir: 'lt', lvl: 32, win: 10, buy: 'TQQQ' },
          { t: ['SPY'], dir: 'lt', lvl: 29, win: 10, buy: 'SPXL' },
          { t: OB12, dir: 'gt', lvl: 80, win: 10, buy: 'UVXY' },
        ],
      };
      const CPRESETS = [
        { label: 'Dip buys + overbought hedge', br: CDEF.br },
        { label: 'Dip buys only', br: CDEF.br.slice(0, 3) },
        { label: 'Overbought hedge only', br: CDEF.br.slice(3) },
      ];
      let C;
      const cmpOf = d => (d === 'lt' ? '<' : '>');
      const encBr = b => [b.t.join('.'), b.dir, b.lvl, b.win, b.buy].join(':');
      const brName = b => (b.t.length > 1 ? 'any of ' + b.t.length : b.t[0]);
      const brLabel = (b, k) => `${k + 1}. ${brName(b)} ${cmpOf(b.dir)} ${b.lvl} &rarr; ${escapeHtml(b.buy)}`;

      function cRead() {
        const q = new URLSearchParams(location.search);
        C = { br: [] };
        const raw = q.get('c');
        if (raw) for (const s of raw.split(';')) {
          const [t, dir, lvl, win, buy] = s.split(':');
          const ts = (t || '').split('.').map(x => x.toUpperCase()).filter(x => P.tickers[x]);
          const B = (buy || '').toUpperCase(), l = parseFloat(lvl), w = parseInt(win, 10);
          if (ts.length && P.tickers[B] && l > 0 && l < 100) C.br.push({ t: ts, dir: dir === 'gt' ? 'gt' : 'lt', lvl: l, win: w >= 2 && w <= 252 ? w : 10, buy: B });
        }
        if (!C.br.length) C.br = JSON.parse(JSON.stringify(CDEF.br));
      }
      function cWrite() {
        if (window.history && history.replaceState) history.replaceState(null, '', location.pathname + '?mode=cascade&c=' + C.br.map(encBr).join(';'));
      }

      // Sample: days where every signal ticker has a settled RSI and every
      // fund has today's and tomorrow's price, as Composer starts a backtest
      // only once all of its tickers have data.
      function cSample(br) {
        const rs = br.map(b => b.t.map(s => rsiOf(s, b.win)));
        const funds = [...new Set(br.map(b => b.buy))];
        const idx = [];
        outer: for (let i = 0; i < N - 1; i++) {
          for (const r of rs) for (const x of r) if (!isFinite(x[i])) continue outer;
          for (const f of funds) { const c = P.tickers[f].closes; if (c[i] == null || c[i + 1] == null) continue outer; }
          idx.push(i);
        }
        let lim = null, limAt = -1;
        br.forEach((b, k) => b.t.forEach((s, m) => { const x = rs[k][m]; let f = 0; while (f < N && !isFinite(x[f])) f++; if (f > limAt) { limAt = f; lim = s; } }));
        funds.forEach(s => { const c = P.tickers[s].closes; let f = 0; while (f < N && c[f] == null) f++; if (f > limAt) { limAt = f; lim = s; } });
        return { idx, rs, lim };
      }

      // Which rule holds each day (-1 = none, falls to ELSE) and its return.
      function cRun(br, sm, lv) {
        const n = sm.idx.length, pick = new Int8Array(n), r = new Float64Array(n);
        for (let j = 0; j < n; j++) {
          const i = sm.idx[j]; let k = -1;
          for (let b = 0; b < br.length && k < 0; b++) {
            const lt = br[b].dir === 'lt', L = lv[b];
            for (const x of sm.rs[b]) { const v = x[i]; if (lt ? v < L : v > L) { k = b; break; } }
          }
          pick[j] = k;
          if (k >= 0) { const c = P.tickers[br[k].buy].closes; r[j] = c[i + 1] / c[i] - 1; }
        }
        return { pick, r };
      }

      // Figures over held days only, as in the original analysis.
      function heldOnly(run, lo, hi) {
        let eq = 1, pk = 1, dd = 0, d = 0, s = 0, up = 0, worst = Infinity;
        for (let j = lo; j < hi; j++) if (run.pick[j] >= 0) {
          const x = run.r[j]; d++; s += x; if (x > 0) up++; worst = Math.min(worst, x);
          eq *= 1 + x; pk = Math.max(pk, eq); dd = Math.min(dd, eq / pk - 1);
        }
        return { d, comp: eq - 1, dd, avg: d ? s / d : NaN, up: d ? up / d : NaN, worst };
      }
      // whole-strategy Sharpe: the picked fund on rule days, BIL on ELSE days
      // (cash where BIL has no price), no risk-free rate subtracted
      function cSharpe(run, sm) {
        const bil = P.tickers.BIL ? P.tickers.BIL.closes : null, n = sm.idx.length;
        let s = 0, s2 = 0;
        for (let j = 0; j < n; j++) {
          const i = sm.idx[j];
          const x = run.pick[j] >= 0 ? run.r[j] : (bil && bil[i] != null && bil[i + 1] != null ? bil[i + 1] / bil[i] - 1 : 0);
          s += x; s2 += x * x;
        }
        const m = s / n, sd = Math.sqrt(Math.max(0, s2 / n - m * m));
        return sd ? m / sd * Math.sqrt(252) : NaN;
      }
      let cVariants = [];

      // ---------- Composer symphony JSON ----------
      // Same schema as the Signal Miner's export (a real Composer export):
      // root -> wt-cash-equal -> if, where each `if` holds exactly two
      // children (the rule and an else) and the next rule nests inside the
      // else. A one-ticker rule is a standard condition; a rule on several
      // tickers is one "any of" condition, which is what this page tests. The deepest else holds BIL, as the backtest does.
      const cUid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID()
        : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); }));
      const cShortId = () => { const cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; for (let i = 0; i < 20; i++) s += cs[Math.random() * cs.length | 0]; return s; };
      const cAsset = tk => ({ id: cUid(), step: 'asset', suppress_incomplete_warnings: false, ticker: tk });
      // Rules in a row that hold the same fund become one IF whose condition is
      // "any of" their signals (order is unchanged, so the result is too). A
      // group with a single signal is a standard condition, flat fields only,
      // exactly as Composer writes one; several signals use Composer's compound
      // "any" block of binary conditions, each with its own ticker and level.
      function cGroups(br) {
        const g = [];
        for (const b of br) {
          const sig = b.t.map(t => ({ t, dir: b.dir, lvl: b.lvl, win: b.win }));
          if (g.length && g[g.length - 1].buy === b.buy) g[g.length - 1].sig.push(...sig);
          else g.push({ buy: b.buy, sig });
        }
        return g;
      }
      function cIf(gs, k) {
        const g = gs[k], s0 = g.sig[0];
        const then = {
          id: cUid(), step: 'if-child', name: 'If', suppress_incomplete_warnings: false,
          children: [cAsset(g.buy)], 'is-else-condition?': false,
          'lhs-fn': 'relative-strength-index', 'lhs-val': s0.t, 'lhs-fn-params': { window: s0.win },
          comparator: s0.dir, 'rhs-fixed-value?': true, 'rhs-val': String(s0.lvl),
        };
        if (g.sig.length > 1) then.condition = {
          'condition-type': 'compound', operator: 'any',
          conditions: g.sig.map(s => ({ 'condition-type': 'binary', lhs: { fn: 'relative-strength-index', ticker: s.t, params: { window: s.win } }, comparator: s.dir, rhs: { constant: s.lvl } })),
        };
        const rest = k + 1 < gs.length ? cIf(gs, k + 1) : cAsset('BIL');
        return {
          id: cUid(), step: 'if', name: 'Condition', suppress_incomplete_warnings: false, weight: { num: 100, den: 100 },
          children: [then, { id: cUid(), step: 'if-child', name: 'Else', suppress_incomplete_warnings: true, children: [rest], 'is-else-condition?': true }],
        };
      }
      function cSymphony() {
        return {
          id: cShortId(), step: 'root', name: 'RSI cascade: ' + C.br.map(b => `${brName(b)} ${cmpOf(b.dir)} ${b.lvl} ${b.buy}`).join(', '),
          children: [{ id: cUid(), step: 'wt-cash-equal', name: 'Weight', suppress_incomplete_warnings: true, children: [cIf(cGroups(C.br), 0)] }],
          description: 'Built with the Composer Atlas RSI Backtester. ' + location.href,
          rebalance: 'daily',
        };
      }

      function brRow(b, k) {
        return `<div class="rc-row" data-b="${k}">
          <div class="rc-head"><span>${k ? 'ELSE IF' : 'IF'}</span>
            <span>${k ? `<button type="button" class="rc-x" data-act="up" title="Move up">&uarr;</button>` : ''}${C.br.length > 1 ? `<button type="button" class="rc-x" data-act="del" title="Remove rule">&times;</button>` : ''}</span></div>
          <div class="rb-params">
            <div class="rb-field rc-wide"><label>Any of these tickers (space separated)</label><input data-f="t" type="text" value="${escapeHtml(b.t.join(' '))}" spellcheck="false" autocomplete="off"><div class="rc-bad" data-bad></div></div>
            <div class="rb-field"><label>RSI days</label><input data-f="win" type="number" min="2" max="252" step="1" value="${b.win}" title="2 to 252 days"></div>
            <div class="rb-field"><label>RSI</label><select data-f="dir"><option value="lt"${b.dir === 'lt' ? ' selected' : ''}>is below</option><option value="gt"${b.dir === 'gt' ? ' selected' : ''}>is above</option></select></div>
            <div class="rb-field"><label>Level</label><select data-f="lvl">${lvlOptions(b.lvl)}</select></div>
            <div class="rb-field"><label>Hold</label><select data-f="buy">${tickerOptions(b.buy)}</select></div>
          </div></div>`;
      }

      function cShell() {
        document.getElementById('rb-root').innerHTML = `
          <div class="rb-panel">
            <div class="rb-chips"><span>Start from an example:</span>${CPRESETS.map((p, k) => `<button type="button" class="rb-chip" data-cp="${k}">${p.label}</button>`).join('')}</div>
            <p class="rb-sub">Each rule is checked in order at every close; the first one that is true picks the fund for the next day. A rule is true when any of its tickers crosses the level. If none is true, your ELSE branch decides.</p>
            <div id="rc-br"></div>
            <button class="btn btn-outline btn-sm" id="rc-add" type="button">+ Add a rule</button>
            ${RSI_HELP}
            <div class="rb-logic"><code id="rb-code"></code><button class="btn btn-outline btn-sm" id="rb-copy-link" type="button">Copy link</button><button class="btn btn-outline btn-sm" id="rc-json-copy" type="button" title="Paste into the Composer editor">Copy Composer JSON</button><span class="rb-copied" id="rb-copied"></span></div>
          </div>

          <div class="rb-panel">
            <h2>Backtest</h2>
            <p class="rb-sub" id="rc-sub"></p>
            <h3 class="rb-h3">Your cascade and the setups around it</h3>
            <div class="db-table-wrap"><table class="db-table rb-table" id="rc-compare"></table></div>
            <p class="rb-sub" style="margin-top:8px" id="rc-compare-note"></p>
          </div>

          <div class="rb-panel">
            <h2>Time in each fund</h2>
            <div class="db-table-wrap"><table class="db-table rb-table rc-static" id="rc-time"></table></div>
            <ul class="rb-notes" id="rc-notes"></ul>
          </div>`;

        const brBox = document.getElementById('rc-br');
        const drawRows = () => { brBox.innerHTML = C.br.map(brRow).join(''); };
        drawRows();
        brBox.addEventListener('change', e => {
          const row = e.target.closest('[data-b]'), f = e.target.dataset.f; if (!row || !f) return;
          const b = C.br[+row.dataset.b], v = e.target.value;
          if (f === 't') {
            const all = v.toUpperCase().split(/[\s,]+/).filter(Boolean);
            const ok = all.filter(s => P.tickers[s]), bad = all.filter(s => !P.tickers[s]);
            row.querySelector('[data-bad]').textContent = bad.length ? 'Not in the price data: ' + bad.join(' ') : '';
            if (!ok.length) return;
            b.t = [...new Set(ok)];
          } else if (f === 'lvl') { const l = parseFloat(v); if (!(l > 0 && l < 100)) return; b.lvl = l; }
          else if (f === 'win') { const w = parseFloat(v); if (!isFinite(w)) { e.target.value = b.win; return; } b.win = clampWin(w); e.target.value = b.win; }
          else b[f] = v;
          cUpdate();
        });
        brBox.addEventListener('click', e => {
          const btn = e.target.closest('[data-act]'); if (!btn) return;
          const k = +btn.closest('[data-b]').dataset.b;
          if (btn.dataset.act === 'del') C.br.splice(k, 1);
          else { const t = C.br[k]; C.br[k] = C.br[k - 1]; C.br[k - 1] = t; }
          drawRows(); cUpdate();
        });
        document.getElementById('rc-add').addEventListener('click', () => {
          C.br.push({ t: ['SPY'], dir: 'lt', lvl: 30, win: 10, buy: 'SPXL' }); drawRows(); cUpdate();
        });
        document.getElementById('rb-copy-link').addEventListener('click', copyLink);
        document.getElementById('rc-json-copy').addEventListener('click', () => copyJson(cSymphony()));
        // clicking a setup row makes it the cascade, as a level row does in One Rule
        document.getElementById('rc-compare').addEventListener('click', e => {
          const tr = e.target.closest('tr[data-v]'); if (!tr) return;
          const v = cVariants[+tr.dataset.v]; if (!v || v.mine) return;
          C.br = v.br.map((b, k) => Object.assign(JSON.parse(JSON.stringify(b)), { lvl: Math.min(99, Math.max(1, v.lv[k])) }));
          drawRows(); cUpdate();
        });
        document.querySelector('.rb-chips').addEventListener('click', e => {
          const b = e.target.closest('[data-cp]'); if (!b) return;
          C.br = JSON.parse(JSON.stringify(CPRESETS[+b.dataset.cp].br));
          cShell(); cUpdate();
        });
      }

      function cUpdate() {
        cWrite();
        document.getElementById('rb-code').textContent = C.br.map((b, k) =>
          `${k ? 'ELSE IF' : 'IF'} ${b.t.length > 1 ? 'any of ' + b.t.join(' ') : b.t[0]} ${b.win}d RSI ${cmpOf(b.dir)} ${b.lvl}  ->  ${b.buy}`).join('\n') + '\nELSE  ->  BIL (in the Composer JSON export)';

        const sm = cSample(C.br), n = sm.idx.length;
        if (n < 60) { document.getElementById('rc-sub').textContent = 'These tickers do not share enough price history to test.'; return; }
        const from = DATES[sm.idx[0]], to = DATES[sm.idx[n - 1] + 1], yrs = n / 252, H2 = Math.floor(n / 2);
        const lv = C.br.map(b => b.lvl);
        const run = cRun(C.br, sm, lv);
        document.getElementById('rc-sub').textContent = `Tested from ${fmtDate(from)} to ${fmtDate(to)} (the test starts once every ticker has data; ${sm.lim} is the latest to arrive). Figures count only the days a fund is held.`;

        // comparison: your setup, each rule removed, and every level moved together
        const variants = [{ label: 'Your setup', br: C.br, lv, mine: true }];
        if (C.br.length > 1) C.br.forEach((b, k) => variants.push({ label: `Without rule ${brLabel(b, k)}`, br: C.br.filter((_, m) => m !== k), lv: lv.filter((_, m) => m !== k) }));
        for (const d of [1, -1, 2, -2]) variants.push({ label: `All levels ${Math.abs(d)} point${Math.abs(d) > 1 ? 's' : ''} ${d > 0 ? 'looser' : 'tighter'}`, br: C.br, lv: C.br.map(b => b.lvl + (b.dir === 'lt' ? d : -d)) });
        cVariants = variants;
        const shTxt = v => `<span class="${v < 0 ? 'rb-neg' : ''}">${isFinite(v) ? v.toFixed(2) : '—'}</span>`;
        const rowsHtml = variants.map((v, vi) => {
          const rr = v.br === C.br ? (v.mine ? run : cRun(C.br, sm, v.lv)) : cRun(v.br, { idx: sm.idx, rs: v.br.map(b => sm.rs[C.br.indexOf(b)]) }, v.lv);
          const h = heldOnly(rr, 0, n);
          return h.d
            ? `<tr data-v="${vi}"${v.mine ? ' class="is-sel"' : ''}><td>${v.label}</td><td>${h.d.toLocaleString('en-US')}</td><td>${signed(h.avg, 2)}</td><td>${Math.round(h.up * 100)}%</td><td>${signed(h.worst)}</td><td>${signed(h.comp)}</td><td>${shTxt(cSharpe(rr, sm))}</td></tr>`
            : `<tr data-v="${vi}"${v.mine ? ' class="is-sel"' : ''}><td>${v.label}</td><td>0</td><td colspan="5" style="text-align:left">never held</td></tr>`;
        });
        document.getElementById('rc-compare').innerHTML =
          '<thead><tr><th>Setup</th><th>Days held</th><th>Avg per day held</th><th>Up days</th><th>Worst day held</th><th>Compounded over held days</th><th>Sharpe</th></tr></thead><tbody>' + rowsHtml.join('') + '</tbody>';
        document.getElementById('rc-compare-note').textContent = `Sharpe scores the whole cascade: the picked fund on rule days, BIL on ELSE days, with no risk-free rate subtracted. Looser means more signal days (higher oversold levels, lower overbought ones). Click a row to use that setup, or a header to sort.`;

        const inMkt = run.pick.reduce((s, k) => s + (k >= 0 ? 1 : 0), 0);
        const stat = k => {
          let d = 0, lg = 0, len = 0; const st = [];
          for (let j = 0; j < n; j++) {
            if (run.pick[j] === k) { d++; if (k >= 0) lg += Math.log1p(run.r[j]); len++; }
            else if (len) { st.push(len); len = 0; }
          }
          if (len) st.push(len);
          return { d, comp: Math.exp(lg) - 1, typ: median(st), long: st.length ? Math.max(...st) : 0 };
        };
        const days = v => `${v} day${v === 1 ? '' : 's'}`;
        const perYr = d => { const v = d / yrs; return v < 1 ? 'under 1 day' : `~${Math.round(v)} days`; };
        document.getElementById('rc-time').innerHTML =
          '<thead><tr><th>Fund</th><th>Days held</th><th>Share of cascade days</th><th>Share of all days</th><th>Per year</th><th>Typical stint</th><th>Longest stint</th><th>Compounded</th></tr></thead><tbody>' +
          C.br.map((b, k) => { const s = stat(k); return s.d
            ? `<tr><td>${brLabel(b, k)}</td><td>${s.d.toLocaleString('en-US')}</td><td>${Math.round(100 * s.d / inMkt)}%</td><td>${(100 * s.d / n).toFixed(1)}%</td><td>${perYr(s.d)}</td><td>${days(s.typ)}</td><td>${days(s.long)}</td><td>${signed(s.comp)}</td></tr>`
            : `<tr><td>${brLabel(b, k)}</td><td>0</td><td colspan="6" style="text-align:left">never held: a rule above always got there first, or it never fired</td></tr>`; }).join('') +
          (s => `<tr class="is-base"><td>none (falls to ELSE)</td><td>${s.d.toLocaleString('en-US')}</td><td></td><td>${Math.round(100 * s.d / n)}%</td><td>${perYr(s.d)}</td><td></td><td></td><td></td></tr>`)(stat(-1)) + '</tbody>';

        const all = heldOnly(run, 0, n), a = heldOnly(run, 0, H2), b = heldOnly(run, H2, n);
        const notes = [
          `<b>Your setup</b> held a fund on ${all.d.toLocaleString('en-US')} days and compounded ${pct(all.comp)} over them, with a worst drop of ${pct(all.dd, 0)}.`,
          `<b>Halves:</b> ${pct(a.comp)} before ${fmtDate(DATES[sm.idx[H2]])} and ${pct(b.comp)} after${(a.comp < 0) !== (b.comp < 0) ? ', so it worked in one era and not the other' : ''}.`,
          `<b>The ELSE branch decides most days.</b> This logic is active about ${Math.round(inMkt / yrs)} days a year; the fallback holds the other ${Math.round(100 * (n - inMkt) / n)}% of the time.`,
          'Check the comparison table: if moving every level by a point or two changes the result a lot, the levels are fitted to history rather than finding something durable.',
          ASSUME,
        ];
        document.getElementById('rc-notes').innerHTML = notes.map(x => `<li>${x}</li>`).join('');
        resortAll();
      }

      // ---------- sortable tables ----------
      // Tables re-render on every change, so each table's chosen sort is kept
      // by id and reapplied. Clicks cycle high-to-low, low-to-high, original.
      // the main tables open sorted by Sharpe, highest first
      const sortBy = { 'rb-sweep': { c: 6, dir: -1 }, 'rc-compare': { c: 6, dir: -1 } };
      const cellNum = td => { const v = parseFloat(td.textContent.replace(/−/g, '-').replace(/[^0-9.\-]/g, '')); return isFinite(v) ? v : null; };
      function applySort(tbl) {
        const st = sortBy[tbl.id], heads = tbl.querySelectorAll('thead th');
        heads.forEach((th, c) => {
          th.classList.add('sortable');
          let a = th.querySelector('.db-sort-arrow');
          if (!a) { a = document.createElement('span'); a.className = 'db-sort-arrow'; th.append(' ', a); }
          const on = st && st.c === c;
          a.classList.toggle('active', !!on);
          a.innerHTML = on ? (st.dir > 0 ? '&#9650;' : '&#9660;') : '&#8597;';
        });
        const body = tbl.tBodies[0]; if (!body) return;
        const rows = [...body.rows];
        rows.forEach((r, k) => { if (r.dataset.o == null) r.dataset.o = k; });
        const live = rows.filter(r => r.cells.length === heads.length && !r.classList.contains('is-base'));
        const rest = rows.filter(r => !live.includes(r)).sort((a, b) => a.dataset.o - b.dataset.o);
        let keyed;
        if (!st) keyed = live.map(r => ({ r, v: +r.dataset.o })).sort((a, b) => a.v - b.v);
        else {
          const nums = live.map(r => cellNum(r.cells[st.c]));
          const numeric = nums.filter(v => v != null).length >= live.length / 2;
          keyed = live.map((r, k) => ({ r, o: +r.dataset.o, v: numeric ? nums[k] : r.cells[st.c].textContent.trim() }));
          keyed.sort((a, b) => {
            if (a.v == null || a.v === '') return 1;
            if (b.v == null || b.v === '') return -1;
            return (numeric ? a.v - b.v : a.v.localeCompare(b.v)) * st.dir || a.o - b.o;
          });
        }
        keyed.forEach(x => body.appendChild(x.r));
        rest.forEach(r => body.appendChild(r));
      }
      const resortAll = () => document.querySelectorAll('#rb-root table.rb-table').forEach(applySort);

      function startMode(m) {
        document.querySelectorAll('#rb-mode button').forEach(x => x.classList.toggle('is-on', x.dataset.m === m));
        if (m === 'cascade') { cRead(); cShell(); cUpdate(); }
        else { readUrl(); shell(); update(); }
      }

      (async function () {
        P = await loadPrices();
        DATES = P.dates; N = DATES.length;
        document.getElementById('rb-refreshed').innerHTML =
          `<span class="updated-badge"><span class="updated-badge-dot"></span>Prices through ${fmtDate(DATES[N - 1])}, refreshed weekly</span>`;
        document.getElementById('rb-mode').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b || b.classList.contains('is-on')) return;
          if (window.history && history.replaceState) history.replaceState(null, '', location.pathname + (b.dataset.m === 'cascade' ? '?mode=cascade' : ''));
          startMode(b.dataset.m);
        });
        document.getElementById('rb-root').addEventListener('click', e => {
          const th = e.target.closest('table.rb-table thead th'); if (!th) return;
          const tbl = th.closest('table'), c = th.cellIndex, st = sortBy[tbl.id];
          sortBy[tbl.id] = !st || st.c !== c ? { c, dir: -1 } : st.dir < 0 ? { c, dir: 1 } : null;
          applySort(tbl);
        });
        const swap = document.getElementById('rb-swap');
        swap.addEventListener('click', () => { swap.href = swap.getAttribute('href').split('?')[0] + location.search; });
        startMode(new URLSearchParams(location.search).get('mode') === 'cascade' ? 'cascade' : 'single');
      })().catch(err => {
        document.getElementById('rb-root').innerHTML = `
          <div class="error-state">
            <h2>Failed to load price data</h2>
            <p>${escapeHtml(err.message)}</p>
          </div>`;
      });
    })();
  </script>
</body>
</html>
